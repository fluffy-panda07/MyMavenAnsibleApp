 -name: Deploy to Tomcat
  hosts: web
  become: yes
  tasks: 
 	-name: Copy WAR file to Tomcat
 	copy:
 		src: "/var/snap/jenkins/5042/workspace/MyMavenAnsibleApp/target/MyMavenAnsibleApp.war"
 		dest: "/opt/tomcat/webapps/MyMavenAnsibleApp.war"
 		
 	-name: Restart tomcat
 	shell: |
 	/opt/tomcat/bin/shutdown.sh || true
 	/opt/tomcat/bin/startup.sh
 	
 
